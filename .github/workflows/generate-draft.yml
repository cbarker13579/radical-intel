name: Generate Weekly Draft

on:
  schedule:
    - cron: "0 10 * * 1"  # Monday 6am ET (EDT = UTC-4, so 10am UTC)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgbm-dev \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxfixes3 \
            libxkbcommon0 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64

      - name: Generate draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node generate.js --draft

      - name: Commit draft to repo
        run: |
          git config user.name "Talent Memo Bot"
          git config user.email "action@github.com"
          test -f archive.json || echo '{"urls":[]}' > archive.json
          git add current-draft.json archive.json
          git commit -m "Weekly draft — $(date +'%B %d, %Y')" || echo "Nothing to commit"
          git push
